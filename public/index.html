<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>LucianOS</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/desktop/desktop.css">
  <script type="module" src="/desktop/desktop.js"></script>
</head>
<body class="desktop-page">
  <nav class="menubar" aria-label="Menu">
    <div class="menu" data-menu="lucianos"><button class="brand">LucianOS</button><div class="items"></div></div>
    <div class="menu" data-menu="file"><button>File</button><div class="items"></div></div>
    <div class="menu" data-menu="edit"><button>Edit</button><div class="items"></div></div>
    <div class="menu" data-menu="go"><button>Go</button><div class="items"></div></div>
    <div class="menu" data-menu="apps"><button>Apps</button><div class="items"></div></div>
    <div class="menu" data-menu="tools"><button>Tools</button><div class="items"></div></div>
    <span id="notice" class="status quiet"></span>
    <span class="spacer"></span>
    <div class="spotlight">
      <input id="spot" type="search" placeholder="Spotlight: files, apps, sums" aria-label="Spotlight search" autocomplete="off">
      <ul id="spotResults" class="spotresults hidden"></ul>
    </div>
    <span id="clock" class="clock"></span>
  </nav>
  <div id="tabs" class="tabs"></div>
  <main id="desktop" class="desktop">
    <div id="desktop-icons" class="desktop-icons" aria-label="Desktop"></div>
  </main>
</body>
</html>
